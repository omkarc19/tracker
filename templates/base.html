<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Sales Tracker{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <nav class="navbar">
    <a href="{{ url_for('dashboard') }}" class="nav-brand">📊 Sales Tracker</a>
    <form class="nav-search" method="GET" action="{{ url_for('search') }}">
      <input type="text" name="q" class="nav-search-input" placeholder="Search deals & tasks..."
             value="{{ request.args.get('q', '') }}" />
    </form>
    <div class="nav-links">
      <a href="{{ url_for('dashboard') }}" class="{% if request.endpoint == 'dashboard' %}active{% endif %}">Dashboard</a>
      <a href="{{ url_for('pipeline') }}" class="{% if request.endpoint in ['pipeline', 'deal_detail'] %}active{% endif %}">Pipeline</a>
      <a href="{{ url_for('tasks_board') }}" class="{% if request.endpoint in ['tasks_board','task_detail','my_tasks','new_task'] %}active{% endif %}">Tasks</a>
      <a href="{{ url_for('calendar_view') }}" class="{% if request.endpoint in ['calendar_view','calendar_event_detail','new_calendar_event','edit_calendar_event'] %}active{% endif %}">Calendar</a>
      <a href="{{ url_for('interviews') }}" class="{% if request.endpoint in ['interviews','interview_detail','new_interview','edit_interview','interview_offers'] %}active{% endif %}">Interviews</a>
      <a href="{{ url_for('team_list') }}" class="{% if request.endpoint in ['team_list'] %}active{% endif %}">Team</a>
      <button class="theme-toggle" onclick="toggleTheme()" title="Toggle dark mode">🌙</button>
      <a href="{{ url_for('new_client') }}" class="btn-nav">+ New Deal</a>
    </div>
  </nav>

  <main class="main-content">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash-container">
          {% for category, message in messages %}
            <div class="flash flash-{{ category }}">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>
  <script>
    document.addEventListener("click", e => {
      if (!e.target.closest(".export-dropdown")) {
        document.querySelectorAll(".export-menu.open").forEach(m => m.classList.remove("open"));
      }
    });

    // Dark mode
    function toggleTheme() {
      const isDark = document.documentElement.getAttribute("data-theme") === "dark";
      const next = isDark ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("theme", next);
      document.querySelector(".theme-toggle").textContent = next === "dark" ? "☀️" : "🌙";
    }
    (function() {
      const saved = localStorage.getItem("theme") || "light";
      document.documentElement.setAttribute("data-theme", saved);
      if (saved === "dark") {
        document.addEventListener("DOMContentLoaded", () => {
          const btn = document.querySelector(".theme-toggle");
          if (btn) btn.textContent = "☀️";
        });
      }
    })();
  </script>
</body>
</html>
