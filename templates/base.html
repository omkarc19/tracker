<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Sales Tracker{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <nav class="navbar">
    <a href="{{ url_for('dashboard') }}" class="nav-brand">📊 Sales Tracker</a>
    <div class="nav-links">
      <a href="{{ url_for('dashboard') }}" class="{% if request.endpoint == 'dashboard' %}active{% endif %}">Dashboard</a>
      <a href="{{ url_for('pipeline') }}" class="{% if request.endpoint in ['pipeline', 'deal_detail'] %}active{% endif %}">Pipeline</a>
      <a href="{{ url_for('targets') }}" class="{% if request.endpoint == 'targets' %}active{% endif %}">Targets</a>
      <a href="{{ url_for('tasks_board') }}" class="{% if request.endpoint in ['tasks_board','task_detail','my_tasks','new_task'] %}active{% endif %}">Tasks</a>
      <a href="{{ url_for('new_client') }}" class="btn-nav">+ New Deal</a>
    </div>
  </nav>

  <main class="main-content">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash-container">
          {% for category, message in messages %}
            <div class="flash flash-{{ category }}">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>
  <script>
    document.addEventListener("click", e => {
      if (!e.target.closest(".export-dropdown")) {
        document.querySelectorAll(".export-menu.open").forEach(m => m.classList.remove("open"));
      }
    });
  </script>
</body>
</html>
