{% extends "base.html" %}
{% block title %}New Task — Sales Tracker{% endblock %}

{% block content %}
<div class="page-header">
  <a href="{{ url_for('tasks_board') }}" class="back-link">← Task Board</a>
  <h1>Create New Task</h1>
</div>

<div class="form-container">
  <form method="POST" action="{{ url_for('new_task') }}">

    <div class="card">
      <h3>Task Info</h3>
      <div class="form-group">
        <label>Title <span class="required">*</span></label>
        <input type="text" name="title" class="input-text" required placeholder="e.g. Send proposal to Acme Corp" />
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea name="description" class="input-textarea" rows="3" placeholder="Context, details, links..."></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Priority</label>
          <select name="priority" class="input-select">
            {% for p in priorities %}
              <option value="{{ p }}" {% if p == "medium" %}selected{% endif %}>{{ p.title() }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label>Due Date</label>
          <input type="date" name="due_date" class="input-text" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Assigned To</label>
          <select id="sel-assigned" class="input-select team-person-select"
                  onchange="handlePersonSelect(this,'txt-assigned','hid-assigned')">
            <option value="">— Select member —</option>
            <option value="__other__">Other (type name)…</option>
          </select>
          <input type="text" id="txt-assigned" class="input-text"
                 placeholder="Type name…" style="display:none;margin-top:6px"
                 oninput="document.getElementById('hid-assigned').value=this.value">
          <input type="hidden" name="assigned_to" id="hid-assigned">
        </div>
        <div class="form-group">
          <label>Created By</label>
          <select id="sel-created" class="input-select team-person-select"
                  onchange="handlePersonSelect(this,'txt-created','hid-created')">
            <option value="">— Select member —</option>
            <option value="__other__">Other (type name)…</option>
          </select>
          <input type="text" id="txt-created" class="input-text"
                 placeholder="Type name…" style="display:none;margin-top:6px"
                 oninput="document.getElementById('hid-created').value=this.value">
          <input type="hidden" name="created_by" id="hid-created">
        </div>
      </div>
    </div>

    <div class="card">
      <h3>Labels</h3>
      <div class="label-checkboxes">
        {% for lbl in labels %}
          <label class="checkbox-label">
            <input type="checkbox" name="labels" value="{{ lbl }}" />
            {{ lbl.replace("_", " ").title() }}
          </label>
        {% endfor %}
      </div>
    </div>

    <div class="card">
      <h3>Link to Deal <span style="font-size:12px;font-weight:400;color:var(--text-sub)">(optional)</span></h3>
      <div class="form-group">
        <select name="deal_id" class="input-select">
          <option value="">— No deal —</option>
          {% for d in deals %}
            <option value="{{ d.id }}">{{ d.client.name }} — {{ d.title }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div class="card">
      <h3>Recurring</h3>
      <label class="checkbox-label" style="flex-direction:row;gap:10px;align-items:center;margin-bottom:12px">
        <input type="checkbox" name="is_recurring" id="is-recurring"
               onchange="document.getElementById('recur-block').style.display=this.checked?'block':'none'" />
        This is a recurring task
      </label>
      <div id="recur-block" style="display:none">
        <div class="form-group">
          <label>Repeat every</label>
          <select name="recur_interval" class="input-select">
            {% for ri in recur_intervals %}
              <option value="{{ ri }}">{{ ri.title() }}</option>
            {% endfor %}
          </select>
        </div>
      </div>
    </div>

    <div class="form-actions">
      <a href="{{ url_for('tasks_board') }}" class="btn btn-secondary">Cancel</a>
      <button type="submit" class="btn btn-primary">Create Task</button>
    </div>

  </form>
</div>

<script>
function handlePersonSelect(sel, txtId, hidId) {
  const txt = document.getElementById(txtId);
  const hid = document.getElementById(hidId);
  if (sel.value === '__other__') {
    txt.style.display = 'block';
    txt.value = '';
    hid.value = '';
    txt.focus();
  } else {
    txt.style.display = 'none';
    hid.value = sel.value;
  }
}

async function loadTeamPersonSelects() {
  const resp = await fetch('/api/team/members');
  const members = await resp.json();
  document.querySelectorAll('.team-person-select').forEach(sel => {
    const otherOpt = sel.querySelector('[value="__other__"]');
    members.forEach(m => {
      const opt = document.createElement('option');
      opt.value = m.name;
      opt.textContent = m.name + (m.role ? ` (${m.role})` : '');
      sel.insertBefore(opt, otherOpt);
    });
  });
}

loadTeamPersonSelects();
</script>
{% endblock %}
