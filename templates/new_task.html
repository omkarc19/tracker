{% extends "base.html" %}
{% block title %}New Task — Sales Tracker{% endblock %}

{% block content %}
<div class="page-header">
  <a href="{{ url_for('tasks_board') }}" class="back-link">← Task Board</a>
  <h1>Create New Task</h1>
</div>

<div class="form-container">
  <form method="POST" action="{{ url_for('new_task') }}">

    <div class="card">
      <h3>Task Info</h3>
      <div class="form-group">
        <label>Title <span class="required">*</span></label>
        <input type="text" name="title" class="input-text" required placeholder="e.g. Send proposal to Acme Corp" />
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea name="description" class="input-textarea" rows="3" placeholder="Context, details, links..."></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Priority</label>
          <select name="priority" class="input-select">
            {% for p in priorities %}
              <option value="{{ p }}" {% if p == "medium" %}selected{% endif %}>{{ p.title() }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label>Due Date</label>
          <input type="date" name="due_date" class="input-text" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Assigned To</label>
          <input type="text" name="assigned_to" class="input-text" placeholder="Team member name" />
        </div>
        <div class="form-group">
          <label>Created By</label>
          <input type="text" name="created_by" class="input-text" placeholder="Your name" />
        </div>
      </div>
    </div>

    <div class="card">
      <h3>Labels</h3>
      <div class="label-checkboxes">
        {% for lbl in labels %}
          <label class="checkbox-label">
            <input type="checkbox" name="labels" value="{{ lbl }}" />
            {{ lbl.replace("_", " ").title() }}
          </label>
        {% endfor %}
      </div>
    </div>

    <div class="card">
      <h3>Link to Deal <span style="font-size:12px;font-weight:400;color:var(--text-sub)">(optional)</span></h3>
      <div class="form-group">
        <select name="deal_id" class="input-select">
          <option value="">— No deal —</option>
          {% for d in deals %}
            <option value="{{ d.id }}">{{ d.client.name }} — {{ d.title }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div class="card">
      <h3>Recurring</h3>
      <label class="checkbox-label" style="flex-direction:row;gap:10px;align-items:center;margin-bottom:12px">
        <input type="checkbox" name="is_recurring" id="is-recurring"
               onchange="document.getElementById('recur-block').style.display=this.checked?'block':'none'" />
        This is a recurring task
      </label>
      <div id="recur-block" style="display:none">
        <div class="form-group">
          <label>Repeat every</label>
          <select name="recur_interval" class="input-select">
            {% for ri in recur_intervals %}
              <option value="{{ ri }}">{{ ri.title() }}</option>
            {% endfor %}
          </select>
        </div>
      </div>
    </div>

    <div class="form-actions">
      <a href="{{ url_for('tasks_board') }}" class="btn btn-secondary">Cancel</a>
      <button type="submit" class="btn btn-primary">Create Task</button>
    </div>

  </form>
</div>
{% endblock %}
