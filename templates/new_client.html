{% extends "base.html" %}
{% block title %}New Deal — Sales Tracker{% endblock %}

{% block content %}
<div class="page-header">
  <a href="{{ url_for('pipeline') }}" class="back-link">← Pipeline</a>
  <h1>Add New Deal</h1>
</div>

<div class="form-container">
  <form method="POST" action="{{ url_for('new_client') }}">

    <div class="card">
      <h3>Client Info</h3>
      <div class="form-row">
        <div class="form-group">
          <label>Name <span class="required">*</span></label>
          <input type="text" name="name" class="input-text" required placeholder="John Doe" />
        </div>
        <div class="form-group">
          <label>Company</label>
          <input type="text" name="company" class="input-text" placeholder="Acme Corp" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Phone</label>
          <input type="tel" name="phone" class="input-text" placeholder="+91 98765 43210" />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" class="input-text" placeholder="john@acme.com" />
        </div>
      </div>
      <div class="form-group">
        <label>Source</label>
        <select name="source" class="input-select">
          <option value="">— Select —</option>
          <option value="referral">Referral</option>
          <option value="cold">Cold Outreach</option>
          <option value="inbound">Inbound</option>
          <option value="event">Event / Conference</option>
          <option value="social">Social Media</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div class="form-group">
        <label>Client Notes</label>
        <textarea name="client_notes" class="input-textarea" rows="2" placeholder="Background, preferences, relationship notes..."></textarea>
      </div>
    </div>

    <div class="card">
      <h3>Deal Info</h3>
      <div class="form-group">
        <label>Deal Title <span class="required">*</span></label>
        <input type="text" name="deal_title" class="input-text" required placeholder="e.g. Annual SaaS subscription" />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Deal Value (₹)</label>
          <input type="number" name="deal_value" class="input-text" placeholder="50000" min="0" step="0.01" />
        </div>
        <div class="form-group">
          <label>Assigned To</label>
          <input type="text" name="salesperson" class="input-text" placeholder="Your name" />
        </div>
      </div>
      <div class="form-group">
        <label>Notes</label>
        <textarea name="notes" class="input-textarea" rows="2" placeholder="Context, requirements, background..."></textarea>
      </div>
      <div class="form-group">
        <label>Labels</label>
        <div class="label-checkboxes">
          {% for lbl in deal_labels %}
            <label class="checkbox-label">
              <input type="checkbox" name="deal_labels" value="{{ lbl }}" />
              {{ lbl.title() }}
            </label>
          {% endfor %}
        </div>
      </div>
    </div>

    <div class="form-actions">
      <a href="{{ url_for('pipeline') }}" class="btn btn-secondary">Cancel</a>
      <button type="submit" class="btn btn-primary">Add Deal</button>
    </div>

  </form>
</div>
{% endblock %}
