{% extends "base.html" %}
{% block title %}Edit Deal — {{ deal.client.name }}{% endblock %}

{% block content %}
<div class="page-header">
  <a href="{{ url_for('deal_detail', deal_id=deal.id) }}" class="back-link">← Back to Deal</a>
  <h1>Edit Deal</h1>
</div>

<div class="form-container">
  <form method="POST" action="{{ url_for('edit_deal', deal_id=deal.id) }}">

    <div class="card">
      <h3>Client Info</h3>
      <div class="form-row">
        <div class="form-group">
          <label>Name <span class="required">*</span></label>
          <input type="text" name="client_name" class="input-text" required value="{{ deal.client.name }}" />
        </div>
        <div class="form-group">
          <label>Company</label>
          <input type="text" name="client_company" class="input-text" value="{{ deal.client.company or '' }}" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Phone</label>
          <input type="tel" name="client_phone" class="input-text" value="{{ deal.client.phone or '' }}" />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" name="client_email" class="input-text" value="{{ deal.client.email or '' }}" />
        </div>
      </div>
    </div>

    <div class="card">
      <h3>Deal Info</h3>
      <div class="form-group">
        <label>Deal Title <span class="required">*</span></label>
        <input type="text" name="title" class="input-text" required value="{{ deal.title }}" />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Deal Value (₹)</label>
          <input type="number" name="value" class="input-text" value="{{ deal.value }}" min="0" step="0.01" />
        </div>
        <div class="form-group">
          <label>Assigned To</label>
          <input type="text" name="salesperson" class="input-text" value="{{ deal.salesperson or '' }}" />
        </div>
      </div>
      <div class="form-group">
        <label>Notes</label>
        <textarea name="notes" class="input-textarea" rows="3">{{ deal.notes or '' }}</textarea>
      </div>
    </div>

    <div class="form-actions">
      <a href="{{ url_for('deal_detail', deal_id=deal.id) }}" class="btn btn-secondary">Cancel</a>
      <button type="submit" class="btn btn-primary">Save Changes</button>
    </div>

  </form>
</div>
{% endblock %}
