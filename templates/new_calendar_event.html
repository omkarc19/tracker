{% extends "base.html" %}
{% block title %}New Event — Calendar{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <a href="{{ url_for('calendar_view') }}" class="back-link">← Calendar</a>
    <h1>New Event</h1>
  </div>
</div>

<div class="form-card" style="max-width:640px">
  <form method="POST">
    <div class="form-row">
      <div class="form-group" style="flex:2">
        <label class="form-label">Title *</label>
        <input type="text" name="title" class="form-input" required placeholder="e.g. Product Demo with Acme" autofocus>
      </div>
      <div class="form-group">
        <label class="form-label">Type</label>
        <select name="event_type" class="form-input">
          {% for et in event_types %}
          <option value="{{ et }}">{{ et.title() }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Date *</label>
        <input type="date" name="date" class="form-input" value="{{ prefill_date }}" required>
      </div>
      <div class="form-group">
        <label class="form-label">Start Time</label>
        <input type="time" name="start_time" class="form-input">
      </div>
      <div class="form-group">
        <label class="form-label">End Time</label>
        <input type="time" name="end_time" class="form-input">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group" style="flex:1">
        <label class="form-label">Location</label>
        <input type="text" name="location" class="form-input" placeholder="Office / Zoom / Coffee shop">
      </div>
      <div class="form-group" style="flex:1">
        <label class="form-label">Meeting Link</label>
        <input type="url" name="meeting_link" class="form-input" placeholder="https://meet.google.com/...">
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Attendees <small style="font-weight:400;color:var(--text-sub)">(comma-separated names)</small></label>
      <input type="text" name="attendees" class="form-input" placeholder="Alice, Bob, Charlie">
    </div>

    <div class="form-group">
      <label class="form-label">Created By</label>
      <input type="text" name="created_by" class="form-input" placeholder="Your name">
    </div>

    <div class="form-group">
      <label class="form-label">Description</label>
      <textarea name="description" class="form-input" rows="2" placeholder="Brief description..."></textarea>
    </div>

    <div class="form-group">
      <label class="form-label">Notes / Agenda</label>
      <textarea name="notes" class="form-input" rows="3" placeholder="Talking points, agenda items..."></textarea>
    </div>

    <div class="form-actions">
      <a href="{{ url_for('calendar_view') }}" class="btn btn-secondary">Cancel</a>
      <button type="submit" class="btn btn-primary">Create Event</button>
    </div>
  </form>
</div>
{% endblock %}
