{% extends "base.html" %}
{% block title %}Edit Event — Calendar{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <a href="{{ url_for('calendar_event_detail', event_id=event.id) }}" class="back-link">← Event</a>
    <h1>Edit Event</h1>
  </div>
</div>

<div class="form-card" style="max-width:640px">
  <form method="POST" onsubmit="syncAttendees()">
    <div class="form-row">
      <div class="form-group" style="flex:2">
        <label class="form-label">Title *</label>
        <input type="text" name="title" class="form-input" required value="{{ event.title }}">
      </div>
      <div class="form-group">
        <label class="form-label">Type</label>
        <select name="event_type" class="form-input">
          {% for et in event_types %}
          <option value="{{ et }}" {% if event.event_type == et %}selected{% endif %}>{{ et.title() }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Date *</label>
        <input type="date" name="date" class="form-input" value="{{ event.date.isoformat() }}" required>
      </div>
      <div class="form-group">
        <label class="form-label">Start Time</label>
        <input type="time" name="start_time" class="form-input" value="{{ event.start_time or '' }}">
      </div>
      <div class="form-group">
        <label class="form-label">End Time</label>
        <input type="time" name="end_time" class="form-input" value="{{ event.end_time or '' }}">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group" style="flex:1">
        <label class="form-label">Location</label>
        <input type="text" name="location" class="form-input" value="{{ event.location or '' }}" placeholder="Office / Zoom">
      </div>
      <div class="form-group" style="flex:1">
        <label class="form-label">Meeting Link</label>
        <input type="url" name="meeting_link" class="form-input" value="{{ event.meeting_link or '' }}" placeholder="https://...">
      </div>
    </div>

    <!-- Attendee tag input — pre-filled from saved attendees -->
    <div class="form-group">
      <label class="form-label">Attendees
        <small style="font-weight:400;color:var(--text-sub)">— select from team or type a temp name + Enter</small>
      </label>
      <div class="tag-input-wrapper">
        <div class="tag-list" id="tag-list"></div>
        <div class="tag-input-controls">
          <select id="member-select" class="form-input" onchange="addFromSelect(this)">
            <option value="">Add team member...</option>
          </select>
          <input type="text" id="temp-input" class="form-input"
                 placeholder="Type name + Enter (temporary)"
                 onkeydown="handleTemp(event)">
        </div>
      </div>
      <input type="hidden" name="attendees" id="attendees-hidden" value="{{ event.attendees or '' }}">
    </div>

    <div class="form-group">
      <label class="form-label">Created By</label>
      <input type="text" name="created_by" class="form-input" value="{{ event.created_by or '' }}">
    </div>

    <div class="form-group">
      <label class="form-label">Description</label>
      <textarea name="description" class="form-input" rows="2">{{ event.description or '' }}</textarea>
    </div>

    <div class="form-group">
      <label class="form-label">Notes / Agenda</label>
      <textarea name="notes" class="form-input" rows="3">{{ event.notes or '' }}</textarea>
    </div>

    <div class="form-actions">
      <a href="{{ url_for('calendar_event_detail', event_id=event.id) }}" class="btn btn-secondary">Cancel</a>
      <button type="submit" class="btn btn-primary">Save Changes</button>
    </div>
  </form>
</div>

<script>
// Pre-load existing attendees from the hidden field
let tags = document.getElementById('attendees-hidden').value
  .split(',').map(s => s.trim()).filter(Boolean);

async function initAttendees() {
  const resp = await fetch('/api/team/members');
  const members = await resp.json();
  const sel = document.getElementById('member-select');
  members.forEach(m => {
    const opt = document.createElement('option');
    opt.value = m.name;
    opt.textContent = m.name + (m.role ? ` (${m.role})` : '');
    sel.appendChild(opt);
  });
  renderTags(); // show existing tags immediately
}

function addTag(name) {
  name = name.trim();
  if (!name || tags.some(t => t.toLowerCase() === name.toLowerCase())) return;
  tags.push(name);
  renderTags();
}

function removeTag(i) { tags.splice(i, 1); renderTags(); }

function renderTags() {
  document.getElementById('tag-list').innerHTML = tags.map((t, i) =>
    `<span class="attendee-tag">${t}<button type="button" class="tag-remove" onclick="removeTag(${i})">×</button></span>`
  ).join('');
  document.getElementById('attendees-hidden').value = tags.join(',');
}

function addFromSelect(sel) {
  if (sel.value) { addTag(sel.value); sel.value = ''; }
}

function handleTemp(e) {
  if (e.key === 'Enter' || e.key === ',') {
    e.preventDefault();
    const val = e.target.value.replace(/,/g, '').trim();
    if (val) { addTag(val); e.target.value = ''; }
  }
}

function syncAttendees() {
  const tmp = document.getElementById('temp-input').value.trim();
  if (tmp) addTag(tmp);
}

initAttendees();
</script>
{% endblock %}
